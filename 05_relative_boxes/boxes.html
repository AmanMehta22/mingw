<!DOCTYPE html>
<html>
<head>
<title>Relative Positioning of Boxes</title>
<style>
.box {
  position: relative;
  width: 150px;
  height: 80px;
  background: lightblue;
  border: 2px solid navy;
  margin: 10px;
  padding: 10px;
}
#box1 { top: 20px; left: 20px; }
#box2 { top: 40px; left: 100px; background: lightgreen; border-color: green; }
#box3 { top: 60px; left: 200px; background: lightcoral; border-color: red; }
</style>
</head>
<body>

<h2>Relative Positioning of Boxes</h2>

<div class="box" id="box1">Box 1</div>
<div class="box" id="box2">Box 2</div>
<div class="box" id="box3">Box 3</div>

</body>
</html>
