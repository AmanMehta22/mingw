#include <stdio.h>
#include <stdint.h>

int main()
{
    uint32_t ip;
    unsigned int a, b, c, d;

    printf("Enter IP address: ");
    scanf("%u.%u.%u.%u", &a, &b, &c, &d);

    ip = ((uint32_t)a << 24) | (b << 16) | (c << 8) | d;

    printf("32-bit IP address: ");

    for (int i = 31; i >= 0; i--)
    {
        printf("%u", (ip >> i) & 1);

        if (i % 8 == 0 && i != 0)
            printf(".");
    }

    printf("\nDotted decimal: %u.%u.%u.%u\n",
           (ip >> 24) & 255,
           (ip >> 16) & 255,
           (ip >> 8) & 255,
           ip & 255);

    return 0;
}`

        code: String.raw`// WAP to find the shortest path using Dijkstra's Algorithm.

#include <stdio.h>

#define INF 9999

int main()
{
    int n, i, j, src;
    int cost[10][10], dist[10], visited[10];
    int min, u;

    printf("Enter number of vertices: ");
    scanf("%d", &n);

    printf("Enter cost matrix (0 for no edge):\n");

    for (i = 0; i < n; i++)
    {
        for (j = 0; j < n; j++)
        {
            scanf("%d", &cost[i][j]);

            if (i != j && cost[i][j] == 0)
                cost[i][j] = INF;
        }
    }

    printf("Enter source vertex (0 to %d): ", n - 1);
    scanf("%d", &src);

    for (i = 0; i < n; i++)
    {
        dist[i] = cost[src][i];
        visited[i] = 0;
    }

    dist[src] = 0;
    visited[src] = 1;

    for (i = 1; i < n; i++)
    {
        min = INF;
        u = -1;

        for (j = 0; j < n; j++)
        {
            if (!visited[j] && dist[j] < min)
            {
                min = dist[j];
                u = j;
            }
        }

        if (u == -1)
            break;

        visited[u] = 1;

        for (j = 0; j < n; j++)
        {
            if (!visited[j] && cost[u][j] != INF &&
                dist[u] + cost[u][j] < dist[j])
            {
                dist[j] = dist[u] + cost[u][j];
            }
        }
    }

    printf("\nShortest distances from vertex %d:\n", src);

    for (i = 0; i < n; i++)
    {
        if (dist[i] == INF)
            printf("To vertex %d = No path\n", i);
        else
            printf("To vertex %d = %d\n", i, dist[i]);
    }

    return 0;
}`

#include <stdio.h>

#define INF 9999

int main()
{
    int n, e, i, j;
    int u[20], v[20], w[20];
    int dist[10], src;

    printf("Enter number of vertices: ");
    scanf("%d", &n);

    printf("Enter number of edges: ");
    scanf("%d", &e);

    printf("Enter edges (source destination weight):\n");

    for (i = 0; i < e; i++)
        scanf("%d %d %d", &u[i], &v[i], &w[i]);

    printf("Enter source vertex: ");
    scanf("%d", &src);

    for (i = 0; i < n; i++)
        dist[i] = INF;

    dist[src] = 0;

    for (i = 1; i < n; i++)
    {
        for (j = 0; j < e; j++)
        {
            if (dist[u[j]] != INF &&
                dist[u[j]] + w[j] < dist[v[j]])
            {
                dist[v[j]] = dist[u[j]] + w[j];
            }
        }
    }

    for (j = 0; j < e; j++)
    {
        if (dist[u[j]] != INF &&
            dist[u[j]] + w[j] < dist[v[j]])
        {
            printf("Negative weight cycle exists");
            return 0;
        }
    }

    printf("Shortest distances from source %d:\n", src);

    for (i = 0; i < n; i++)
    {
        if (dist[i] == INF)
            printf("Vertex %d: No path\n", i);
        else
            printf("Vertex %d: %d\n", i, dist[i]);
    }

    return 0;
}`

#include <stdio.h>

int main()
{
    int d[7], r[7], i, p1, p2, p4;

    printf("Enter 4 data bits: ");

    d[3] = d[4] ^ d[5] ^ d[6];

    printf("Hamming code: ");
    for (i = 0; i < 7; i++)
        printf("%d", d[i]);

    printf("\nEnter received 7 bits: ");
    for (i = 0; i < 7; i++)
        scanf("%d", &r[i]);

    p1 = r[0] ^ r[2] ^ r[4] ^ r[6];
    p2 = r[1] ^ r[2] ^ r[5] ^ r[6];
    p4 = r[3] ^ r[4] ^ r[5] ^ r[6];

    i = p1 + 2 * p2 + 4 * p4;

    if (i == 0)
        printf("Received codeword is correct");

}`

function copyText(text, btn, label) {
    const done = () => {
        const old = btn.textContent;
        btn.textContent = "Copied!";
        btn.classList.add("done");
        setTimeout(() => {
            btn.textContent = old;
            btn.classList.remove("done");
        }, 1500);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallback());
    } else {
        fallback();
    }

    function fallback() {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); } catch (e) {}
        document.body.removeChild(ta);
    }
}

    const qBtn = document.createElement("button");

    qBtn.textContent = "Copy question";
    qBtn.addEventListener("click", () => copyText(p.question, qBtn));

    const cBtn = document.createElement("button");
    cBtn.type = "button";
    cBtn.textContent = "Copy code";
    cBtn.addEventListener("click", () => copyText(p.code, cBtn));

    actions.append(qBtn, cBtn);
    head.append(h2, actions);

    const body = document.createElement("div");
    body.className = "q-body";

    const q = document.createElement("p");
    q.className = "question";
    q.textContent = p.question;

    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.textContent = p.code;
    pre.appendChild(code);

    body.append(q, pre);
    art.append(head, body);
    list.appendChild(art);
