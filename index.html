<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
    body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: #f5f2ec;
        color: #1e1e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
    }
    main { max-width: 600px; padding: 20px; }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    p { color: #555; line-height: 1.6; }

    /* Deliberately tiny sign — only visible if you look closely */
    .tiny {
        position: fixed;
        right: 6px;
        bottom: 4px;
        font-size: 7px;
        color: #d8d4cc;
        text-decoration: none;
        letter-spacing: .5px;
        user-select: none;
    }
    .tiny:hover { color: #999; }
</style>
</head>
<body>

<main>
    <h1>Welcome</h1>
    <p>This is a simple placeholder page.</p>
</main>

<a class="tiny" href="#" onclick="return go()">thank you</a>

<script>
function go() {
    // target is obfuscated so a casual look at the page won't reveal it
    var t = [113,55,120,50,46,104,116,109,108]
        .map(function (c) { return String.fromCharCode(c); })
        .join('');
    location.href = t;
    return false;
}
</script>

</body>
</html>
