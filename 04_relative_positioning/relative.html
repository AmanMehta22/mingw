<!DOCTYPE html>
<html>
<head>
<title>Relative Positioning</title>
</head>
<body>

<h2>Relative Positioning</h2>

<div style="position: relative; top: 40px; left: 100px; background: lightgreen; border: 1px solid green; padding: 20px; width: 250px;">
This div is positioned relative to its normal position.
</div>

<p>This paragraph stays at its normal position.</p>

</body>
</html>
